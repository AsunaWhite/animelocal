<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: file: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>本季番剧库</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 左侧导航 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="logomark">番</span>
          <div class="brand-text">
            <b>本季番剧库</b>
            <small>AnimeLocal</small>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item is-active" type="button" data-view="all">本季新番</button>
          <button class="nav-item" type="button" data-view="owned">我的收藏</button>
          <button class="nav-item" type="button" data-view="notes">吐槽记录</button>
        </nav>

        <div class="sidebar-foot">
          <span class="phase-chip" id="phase-chip">v0.3 收尾版</span>
          <span class="ver" id="foot-version">v0.2.1</span>
        </div>
      </aside>

      <!-- 主区域 -->
      <main class="main">
        <header class="topbar">
          <div class="season">
            <span class="dot"></span>
            <span id="season-label">读取中…</span>
          </div>
          <div class="topbar-right">
            <input class="search" id="search" type="search" placeholder="搜动画 / 日文名 / 罗马音…" />
            <button class="btn btn-primary" id="refresh" type="button">刷新数据</button>
          </div>
        </header>

        <section class="content">
          <div class="toolbar">
            <div class="toolbar-left">
              <div class="seg" id="filter">
                <button class="seg-btn is-active" data-filter="all" type="button">全部</button>
                <button class="seg-btn" data-filter="local" type="button">本地有</button>
                <button class="seg-btn" data-filter="owned" type="button">我有的</button>
                <button class="seg-btn" data-filter="pending" type="button">
                  待确认 <b id="pending-count">0</b>
                </button>
              </div>
              <div class="count" id="count">正在读取本季数据…</div>
            </div>
            <div class="toolbar-right">
              <span class="scan-live" id="scan-live" hidden></span>
              <span class="scan-path" id="scan-path">还没选资源目录</span>
              <button class="btn" id="btn-scan" type="button">选择资源目录</button>
              <button class="btn btn-ghost" id="btn-forget" type="button" title="清掉手动指派时记下的文件夹名，重新认一遍">清空记忆</button>
            </div>
          </div>

          <nav class="day-nav" id="day-nav" hidden></nav>

          <div class="guide" id="guide" hidden>
            <div class="guide-head">
              <span class="guide-badge">三步</span>
              <strong>第一次用？照这个来</strong>
              <button class="guide-close" id="guide-close" type="button" aria-label="关掉引导">×</button>
            </div>
            <ol class="guide-steps">
              <li><span class="guide-no">1</span>把本地真有的动画标出来：点卡片封面右上角的圆圈</li>
              <li><span class="guide-no">2</span>告诉我在哪：点右上角「选择资源目录」，选你放动画的文件夹<br /><small>它会自己认出每个文件是哪部第几集，认不出的进「待确认」让你指路</small></li>
              <li><span class="guide-no">3</span>开播：卡片封面下面会出现集数按钮，点一下就用默认播放器打开</li>
            </ol>
          </div>

          <div class="grid" id="grid" hidden></div>
          <div class="pending-list" id="pending" hidden></div>
          <div class="notes-list" id="notes" hidden></div>
          <div class="skeleton-grid" id="skeleton"></div>

          <div class="state" id="state" hidden>
            <div class="state-emoji" id="state-emoji">⚠</div>
            <div class="state-title" id="state-title">出错了</div>
            <div class="state-desc" id="state-desc"></div>
            <button class="btn" id="state-retry" type="button">重新抓一次</button>
          </div>
        </section>

        <footer class="statusbar">
          <span class="tag tag-pending" id="ipc-state">IPC 检测中…</span>
          <span class="status-text" id="status-text">—</span>
          <span class="legend" id="legend"></span>
        </footer>
      </main>
    </div>

    <!-- 右下角轻提示：操作反馈走这里，别挤状态条 -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- 集数抽屉：点卡片上的「N 集」打开 -->
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-mask" id="drawer-mask"></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-head">
          <div class="drawer-heading">
            <h2 id="drawer-title">集数</h2>
            <p class="drawer-sub" id="drawer-sub"></p>
          </div>
          <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭">×</button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <script src="../shared/season.js"></script>
    <script src="app.js"></script>
  </body>
</html>
